[filtered_dataset]
# The username whose messages we want to emulate
user_target = Alice Thompson

# The spaCy model to use (e.g., es_core_news_sm for Spanish, en_core_web_sm for English)
spacy_model = en_core_web_sm

# The output JSONL file for the filtered dataset
json_file = filtered_telegram_chat.jsonl

# Comma-separated list of words that indicate a question
question_words = what, how, where, why, who, which, when, could, should, will, would, do, believe, best, can, had
