; Configuration for dataset filtering and preparation
[filtered_dataset]
; Target user for persona extraction - affects data filtering selection. Should be a unique identifier.
user_target = Miguel Ausó
; SpaCy NLP model for text analysis - impacts tokenization quality. Options: en_core_web_sm, en_core_web_md, en_core_web_lg
spacy_model = es_core_news_lg          
; Source dataset file - use JSONL format for line-by-line processing. Should contain message history.
json_file = filtered_telegram_chat.jsonl
; Query identifiers - used to detect questions in conversations. Can be extended with domain-specific terms.
question_words = qué, cómo, dónde, por qué, quién, cuál, cuándo, podría, debería, será, sería, hacer, creer, mejor, puede, había

; Settings for tokenizing text data
[tokenizer]
; Maximum sequence length - affects memory usage and context window. Range: 128-4096, model dependent.
max_length = 512
; Tokenizer model - determines vocabulary and subword tokenization. Should match fine-tuning base model.
model_name = mistralai/Mistral-7B-Instruct-v0.3

; Parameters controlling the model fine-tuning process
[fine_tuning]
; Tokenized dataset location - output from the tokenizer. Should be a directory containing tokenized files.
tokenized_telegram_chat = ./tokenized_telegram_chat
; Base model - foundation for fine-tuning, determines architecture and parameter count. Affects GPU requirements.
model_name = mistralai/Mistral-7B-Instruct-v0.3
; Model save location - absolute or relative path. Requires sufficient disk space (10-20GB+).
output_dir = ./mistral-finetuned
; Controls parameter update magnitude - lower values for stable training, higher for faster convergence. Range: 1e-6 to 5e-5 for LLMs.
learning_rate = 1e-5
; Samples per forward pass - affects VRAM usage and training stability. Range: 1-64 depending on GPU memory.
batch_size = 4
; Complete dataset iterations - affects training time and potential overfitting. Range: 1-10, model dependent.
num_train_epochs = 5
; L2 regularization strength - prevents overfitting by penalizing large weights. Range: 0.0-0.1, commonly 0.01-0.05.
weight_decay = 0.01
; Maximum checkpoints retained - limits disk usage. Range: 1-5, depends on storage constraints.
save_total_limit = 2
; Training steps between checkpoints - balances safety vs I/O overhead. Range: 100-5000.
save_steps = 1000
; TensorBoard log location - for training metrics visualization. Should be uniquely named per experiment.
logging_dir = ./logs
; Steps between weight updates - simulates larger batch sizes. Range: 1-16, higher values for memory constraints.
gradient_accumulation_steps = 8
; Steps between logging updates - controls verbosity and I/O overhead. Range: 10-1000.
logging_steps = 100
; Steps between evaluation runs - affects validation frequency. Range: 100-1000.
eval_steps = 100