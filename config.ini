; Configuration for dataset filtering and preparation
[filtered_dataset]
user_target = Alice Thompson        ; Target user for persona extraction - affects data filtering selection. Should be a unique identifier.
spacy_model = en_core_web_sm        ; SpaCy NLP model for text analysis - impacts tokenization quality. Options: en_core_web_sm, en_core_web_md, en_core_web_lg
json_file = filtered_telegram_chat.jsonl  ; Source dataset file - use JSONL format for line-by-line processing. Should contain message history.
question_words = what, how, where, why, who, which, when, could, should, will, would, do, believe, best, can, had  ; Query identifiers - used to detect questions in conversations. Can be extended with domain-specific terms.

; Settings for tokenizing text data
[tokenizer]
max_length = 512                    ; Maximum sequence length - affects memory usage and context window. Range: 128-4096, model dependent.
model_name = mistralai/Mistral-7B-v0.1  ; Tokenizer model - determines vocabulary and subword tokenization. Should match fine-tuning base model.

; Parameters controlling the model fine-tuning process
[fine_tuning]
model_name = mistralai/Mistral-7B-v0.1  ; Base model - foundation for fine-tuning, determines architecture and parameter count. Affects GPU requirements.
output_dir = ./mistral-finetuned    ; Model save location - absolute or relative path. Requires sufficient disk space (10-20GB+).
learning_rate = 1e-5                ; Controls parameter update magnitude - lower values for stable training, higher for faster convergence. Range: 1e-6 to 5e-5 for LLMs.
batch_size = 4                      ; Samples per forward pass - affects VRAM usage and training stability. Range: 1-64 depending on GPU memory.
num_train_epochs = 3                ; Complete dataset iterations - affects training time and potential overfitting. Range: 1-10, model dependent.
weight_decay = 0.01                 ; L2 regularization strength - prevents overfitting by penalizing large weights. Range: 0.0-0.1, commonly 0.01-0.05.
save_total_limit = 2                ; Maximum checkpoints retained - limits disk usage. Range: 1-5, depends on storage constraints.
save_steps = 1000                   ; Training steps between checkpoints - balances safety vs I/O overhead. Range: 100-5000.
logging_dir = ./logs                ; TensorBoard log location - for training metrics visualization. Should be uniquely named per experiment.
gradient_accumulation_steps = 8     ; Steps between weight updates - simulates larger batch sizes. Range: 1-16, higher values for memory constraints.